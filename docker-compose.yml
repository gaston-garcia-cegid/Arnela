services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: arnela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arnela_db
      POSTGRES_USER: arnela_user
      POSTGRES_PASSWORD: arnela_secure_pass_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arnela_user -d arnela_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arnela-network

  # Redis Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: arnela-redis
    restart: unless-stopped
    command: redis-server --requirepass arnela_redis_pass_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arnela-network

  # Go API (Backend) - only starts with: docker-compose --profile app up -d
  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arnela-go-api
    restart: unless-stopped
    profiles:
      - app
    environment:
      # Application
      ENVIRONMENT: development
      SERVER_PORT: 8080
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arnela_user
      DB_PASSWORD: arnela_secure_pass_2024
      DB_NAME: arnela_db
      DB_SSLMODE: disable
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: arnela_redis_pass_2024
      REDIS_DB: 0
      
      # JWT Secret
      JWT_SECRET: your_jwt_secret_key_change_in_production
      # CORS: list every dev origin you use (localhost vs 127.0.0.1 are different).
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend:/app
    networks:
      - arnela-network

volumes:
  postgres_data:
  redis_data:

networks:
  arnela-network:
    driver: bridge
