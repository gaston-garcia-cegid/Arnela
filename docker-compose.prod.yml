services:
  postgres:
    image: postgres:16-alpine
    container_name: arnela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arnela_db}
      POSTGRES_USER: ${DB_USER:-arnela_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /DATA/AppData/Arnela/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arnela_user} -d ${DB_NAME:-arnela_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arnela-network

  redis:
    image: redis:7-alpine
    container_name: arnela-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /DATA/AppData/Arnela/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arnela-network

  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arnela-go-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-arnela_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-arnela_db}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      # FIX: Must match the public-facing URL of the frontend exactly
      # Same origin that the browser uses — no trailing slash
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arnela-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # FIX: This must be the PUBLIC URL of the API as seen from the browser,
        # not the internal Docker service name. Nginx proxies /api → go-api:8080
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.prod}
    container_name: arnela-frontend
    restart: unless-stopped
    depends_on:
      - go-api
    networks:
      - arnela-network

  nginx:
    image: nginx:alpine
    container_name: arnela-nginx
    restart: unless-stopped
    ports:
      - "8101:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - go-api
    networks:
      - arnela-network

networks:
  arnela-network:
    driver: bridge